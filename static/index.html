<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>INTERNETSHOP — магазин</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,600;9..144,700&family=Inter:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  :root{
    --paper:#F1EEE3;
    --card:#FFFDF8;
    --ink:#20241F;
    --ink-soft:#5B5D53;
    --ink-faint:#8B8D80;
    --accent:#C68B12;
    --accent-deep:#8F6209;
    --line:#D6D0BE;
    --danger:#A23B2E;
    --danger-bg:#F6E6E1;
    --success:#3E6B4F;
    --success-bg:#E4EEE6;
    --radius:10px;
    --shadow:0 1px 2px rgba(32,36,31,0.06), 0 4px 14px rgba(32,36,31,0.05);
  }
  *{box-sizing:border-box;}
  html{-webkit-text-size-adjust:100%;}
  body{
    margin:0;
    background:var(--paper);
    color:var(--ink);
    font-family:'Inter',sans-serif;
    line-height:1.45;
    min-height:100vh;
  }
  h1,h2,h3{
    font-family:'Fraunces',serif;
    font-weight:600;
    margin:0 0 4px;
    letter-spacing:-0.01em;
  }
  .mono{ font-family:'IBM Plex Mono',monospace; }
  a{ color:inherit; }
  button, input, select{ font-family:inherit; font-size:inherit; }
  button{ cursor:pointer; }
  :focus-visible{ outline:2px solid var(--accent); outline-offset:2px; }

  /* ---------- Header ---------- */
  header{
    position:sticky; top:0; z-index:20;
    background:var(--paper);
    border-bottom:1px solid var(--line);
  }
  .header-inner{
    max-width:980px; margin:0 auto; padding:14px 20px;
    display:flex; align-items:center; justify-content:space-between; gap:16px;
    flex-wrap:wrap;
  }
  .logo{
    font-family:'Fraunces',serif; font-weight:700; font-size:20px;
    letter-spacing:-0.02em;
    display:flex; align-items:baseline; gap:6px;
  }
  .logo span{ color:var(--accent); font-family:'IBM Plex Mono',monospace; font-weight:500; font-size:13px; }
  nav.main-nav{ display:flex; align-items:center; gap:4px; flex-wrap:wrap; }
  .nav-btn{
    background:none; border:none; color:var(--ink-soft);
    padding:8px 12px; border-radius:8px; font-weight:500; font-size:14px;
    display:flex; align-items:center; gap:6px;
  }
  .nav-btn:hover{ background:rgba(32,36,31,0.06); color:var(--ink); }
  .nav-btn.active{ background:var(--ink); color:var(--paper); }
  .nav-badge{
    background:var(--accent); color:var(--paper); font-family:'IBM Plex Mono',monospace;
    font-size:11px; padding:1px 6px; border-radius:999px; font-weight:600;
  }
  .user-chip{
    display:flex; align-items:center; gap:10px; font-size:13px; color:var(--ink-soft);
  }
  .user-chip b{ color:var(--ink); font-weight:600; }
  .btn-ghost{
    background:none; border:1px solid var(--line); color:var(--ink-soft);
    padding:6px 12px; border-radius:8px; font-size:13px;
  }
  .btn-ghost:hover{ border-color:var(--ink-faint); color:var(--ink); }

  /* ---------- Layout ---------- */
  main{ max-width:980px; margin:0 auto; padding:28px 20px 80px; }
  .page-title{ margin-bottom:18px; }
  .page-title p{ margin:2px 0 0; color:var(--ink-soft); font-size:14px; }

  /* ---------- Buttons ---------- */
  .btn{
    background:var(--ink); color:var(--paper); border:none;
    padding:10px 18px; border-radius:8px; font-weight:600; font-size:14px;
    transition:transform .08s ease;
  }
  .btn:hover{ background:#111411; }
  .btn:active{ transform:scale(0.98); }
  .btn:disabled{ opacity:.45; cursor:not-allowed; }
  .btn-accent{ background:var(--accent); color:#241800; }
  .btn-accent:hover{ background:var(--accent-deep); color:#fff; }
  .btn-danger{ background:none; color:var(--danger); border:1px solid var(--danger); padding:6px 10px; font-size:13px; border-radius:6px; font-weight:600; }
  .btn-danger:hover{ background:var(--danger-bg); }
  .btn-small{ padding:6px 10px; font-size:13px; border-radius:6px; }
  .btn-block{ width:100%; }

  /* ---------- Forms ---------- */
  .field{ margin-bottom:14px; }
  .field label{ display:block; font-size:12px; font-weight:600; text-transform:uppercase; letter-spacing:.04em; color:var(--ink-soft); margin-bottom:6px; }
  .field input, .field select{
    width:100%; padding:10px 12px; border:1px solid var(--line); border-radius:8px;
    background:var(--card); color:var(--ink);
  }
  .field input:focus, .field select:focus{ border-color:var(--accent); }
  .form-error{
    background:var(--danger-bg); color:var(--danger); padding:9px 12px; border-radius:8px;
    font-size:13px; margin-bottom:14px; display:none;
  }
  .form-error.show{ display:block; }

  /* ---------- Cards / catalog ---------- */
  .card{ background:var(--card); border:1px solid var(--line); border-radius:var(--radius); box-shadow:var(--shadow); }
  .chips{ display:flex; gap:8px; flex-wrap:wrap; margin-bottom:20px; }
  .chip{
    background:var(--card); border:1px solid var(--line); color:var(--ink-soft);
    padding:6px 14px; border-radius:999px; font-size:13px; font-weight:500;
  }
  .chip.active{ background:var(--ink); color:var(--paper); border-color:var(--ink); }
  .grid{ display:grid; grid-template-columns:repeat(auto-fill, minmax(210px,1fr)); gap:16px; }
  .product-card{ padding:16px; display:flex; flex-direction:column; gap:8px; }
  .product-cat{ font-size:11px; text-transform:uppercase; letter-spacing:.05em; color:var(--ink-faint); font-weight:600; }
  .product-name{ font-weight:600; font-size:15px; flex:1; }
  .product-price{ font-family:'IBM Plex Mono',monospace; color:var(--accent-deep); font-size:18px; font-weight:600; }
  .empty-state{ text-align:center; padding:50px 20px; color:var(--ink-soft); }
  .empty-state h3{ color:var(--ink); }

  /* ---------- Receipt ticket (signature element) ---------- */
  .ticket{
    background:var(--card);
    border:1px solid var(--line);
    border-radius:4px;
    box-shadow:var(--shadow);
    position:relative;
    margin-bottom:22px;
    padding:20px 22px 18px;
  }
  .ticket::before, .ticket::after{
    content:"";
    position:absolute; left:0; right:0; height:10px;
    background-image:radial-gradient(circle at 50% 50%, var(--paper) 3.5px, transparent 3.6px);
    background-size:16px 10px; background-repeat:repeat-x;
  }
  .ticket::before{ top:-6px; }
  .ticket::after{ bottom:-6px; transform:rotate(180deg); }
  .ticket-head{ display:flex; justify-content:space-between; align-items:baseline; margin-bottom:12px; }
  .ticket-head .oid{ font-family:'IBM Plex Mono',monospace; font-weight:600; font-size:14px; }
  .ticket-head .odate{ font-family:'IBM Plex Mono',monospace; font-size:12px; color:var(--ink-faint); }
  .tline{
    display:flex; align-items:baseline; gap:6px; padding:5px 0; font-size:14px;
  }
  .tline .tname{ white-space:nowrap; overflow:hidden; }
  .tline .tleader{ flex:1; border-bottom:1px dotted var(--line); position:relative; top:-3px; margin:0 2px; }
  .tline .tqty{ color:var(--ink-faint); font-family:'IBM Plex Mono',monospace; font-size:12px; margin-right:2px; }
  .tline .tval{ font-family:'IBM Plex Mono',monospace; font-weight:500; white-space:nowrap; }
  .ttotal{
    display:flex; justify-content:space-between; align-items:baseline;
    border-top:1px dashed var(--line); margin-top:10px; padding-top:10px;
    font-weight:700; font-size:16px;
  }
  .ttotal .tval{ font-family:'IBM Plex Mono',monospace; color:var(--accent-deep); font-size:18px; }

  /* ---------- Cart rows ---------- */
  .cart-row{
    display:flex; align-items:center; gap:12px; padding:12px 0;
    border-bottom:1px dashed var(--line);
  }
  .cart-row:last-of-type{ border-bottom:none; }
  .cart-row .cname{ flex:1; font-weight:500; font-size:14px; }
  .cart-row .cprice{ font-family:'IBM Plex Mono',monospace; color:var(--ink-soft); font-size:13px; width:80px; text-align:right; }
  .qty-stepper{ display:flex; align-items:center; border:1px solid var(--line); border-radius:8px; overflow:hidden; }
  .qty-stepper button{ background:var(--card); border:none; width:26px; height:26px; font-size:15px; color:var(--ink-soft); }
  .qty-stepper button:hover{ background:var(--paper); color:var(--ink); }
  .qty-stepper .qnum{ width:28px; text-align:center; font-family:'IBM Plex Mono',monospace; font-size:13px; }
  .cart-row .csub{ font-family:'IBM Plex Mono',monospace; font-weight:600; width:80px; text-align:right; }
  .cart-row .cx{ background:none; border:none; color:var(--ink-faint); font-size:16px; padding:4px; }
  .cart-row .cx:hover{ color:var(--danger); }

  /* ---------- Auth ---------- */
  .auth-wrap{ max-width:380px; margin:40px auto 0; }
  .tabs{ display:flex; border:1px solid var(--line); border-radius:9px; overflow:hidden; margin-bottom:20px; }
  .tabs button{ flex:1; background:var(--card); border:none; padding:10px; font-weight:600; font-size:13px; color:var(--ink-soft); }
  .tabs button.active{ background:var(--ink); color:var(--paper); }
  .auth-card{ padding:24px; }

  /* ---------- Admin ---------- */
  .admin-tabs{ display:flex; gap:8px; margin-bottom:18px; }
  table{ width:100%; border-collapse:collapse; font-size:14px; }
  th{ text-align:left; font-size:11px; text-transform:uppercase; letter-spacing:.04em; color:var(--ink-faint); padding:8px 10px; border-bottom:1px solid var(--line); }
  td{ padding:9px 10px; border-bottom:1px solid var(--line); }
  tr:last-child td{ border-bottom:none; }
  .admin-add{ display:flex; gap:10px; align-items:flex-end; margin-top:18px; flex-wrap:wrap; }
  .admin-add .field{ margin-bottom:0; flex:1; min-width:120px; }
  .table-card{ padding:6px 16px 16px; margin-bottom:24px; }
  .table-card h3{ padding:14px 0 4px; }
  .price-mono{ font-family:'IBM Plex Mono',monospace; color:var(--accent-deep); }

  /* ---------- Toasts ---------- */
  #toasts{ position:fixed; bottom:18px; right:18px; display:flex; flex-direction:column; gap:8px; z-index:100; }
  .toast{
    background:var(--ink); color:var(--paper); padding:11px 16px; border-radius:8px; font-size:13px;
    box-shadow:var(--shadow); max-width:300px; animation:slidein .18s ease-out;
  }
  .toast.err{ background:var(--danger); }
  .toast.ok{ background:var(--success); }
  @keyframes slidein{ from{ opacity:0; transform:translateY(6px); } to{ opacity:1; transform:translateY(0); } }

  .center-loading{ text-align:center; padding:60px; color:var(--ink-faint); font-family:'IBM Plex Mono',monospace; font-size:13px; }

  @media (max-width:640px){
    .header-inner{ padding:12px 14px; }
    main{ padding:20px 14px 70px; }
    nav.main-nav{ order:3; width:100%; justify-content:flex-start; }
  }
  @media (prefers-reduced-motion: reduce){
    *{ animation:none !important; transition:none !important; }
  }
</style>
</head>
<body>

<header>
  <div class="header-inner">
    <div class="logo">INTERNETSHOP <span id="storeMark">№ 001</span></div>
    <nav class="main-nav" id="mainNav"></nav>
  </div>
</header>

<main id="app"></main>
<div id="toasts"></div>

<script>
/* =========================================================
   CONFIG
========================================================= */
const API_BASE = "https://internetshop-j1ep.onrender.com";

/* =========================================================
   STATE
========================================================= */
const state = {
  token: localStorage.getItem("shop_token") || null,
  user: null,          // {id, username, is_admin}
  route: "catalog",    // catalog | cart | orders | admin | auth
  categories: [],
  products: [],
  cart: [],
  authTab: "login",
};

/* =========================================================
   API HELPER
========================================================= */
async function api(path, { method = "GET", body, auth = false } = {}) {
  const headers = { "Content-Type": "application/json" };
  if (auth && state.token) headers["Authorization"] = "Bearer " + state.token;
  let res;
  try {
    res = await fetch(API_BASE + path, {
      method,
      headers,
      body: body !== undefined ? JSON.stringify(body) : undefined,
    });
  } catch (e) {
    throw new Error("Нет связи с сервером. Попробуйте ещё раз.");
  }
  if (res.status === 204) return null;
  let data = null;
  try { data = await res.json(); } catch (e) { /* no body */ }
  if (!res.ok) {
    const msg = (data && data.detail) ? data.detail : `Ошибка ${res.status}`;
    const err = new Error(typeof msg === "string" ? msg : JSON.stringify(msg));
    err.status = res.status;
    throw err;
  }
  return data;
}

/* =========================================================
   TOASTS
========================================================= */
function toast(message, type = "") {
  const el = document.createElement("div");
  el.className = "toast" + (type ? " " + type : "");
  el.textContent = message;
  document.getElementById("toasts").appendChild(el);
  setTimeout(() => el.remove(), 3800);
}

/* =========================================================
   AUTH
========================================================= */
function setToken(t) {
  state.token = t;
  if (t) localStorage.setItem("shop_token", t);
  else localStorage.removeItem("shop_token");
}

async function loadCurrentUser() {
  if (!state.token) { state.user = null; return; }
  try {
    state.user = await api("/auth/me", { auth: true });
  } catch (e) {
    setToken(null);
    state.user = null;
  }
}

function logout() {
  setToken(null);
  state.user = null;
  state.cart = [];
  navigate("catalog");
  toast("Вы вышли из аккаунта");
}

/* =========================================================
   ROUTER / NAV
========================================================= */
function navigate(route) {
  if ((route === "cart" || route === "orders") && !state.user) {
    state.route = "auth"; state.authTab = "login";
    renderAll();
    toast("Сначала войдите в аккаунт", "err");
    return;
  }
  if (route === "admin" && (!state.user || !state.user.is_admin)) {
    route = "catalog";
  }
  state.route = route;
  renderAll();
  window.scrollTo({ top: 0, behavior: "instant" in window ? "instant" : "auto" });
}

function renderNav() {
  const nav = document.getElementById("mainNav");
  nav.innerHTML = "";

  const items = [["catalog", "Каталог"]];
  if (state.user && !state.user.is_admin) items.push(["cart", `Корзина${state.cart.length ? ` <span class="nav-badge">${state.cart.length}</span>` : ""}`]);
  if (state.user) items.push(["orders", "Заказы"]);
  if (state.user && state.user.is_admin) items.push(["admin", "Админ"]);

  items.forEach(([route, label]) => {
    const b = document.createElement("button");
    b.className = "nav-btn" + (state.route === route ? " active" : "");
    b.innerHTML = label;
    b.onclick = () => navigate(route);
    nav.appendChild(b);
  });

  if (state.user) {
    const chip = document.createElement("div");
    chip.className = "user-chip";
    chip.innerHTML = `<span><b>${escapeHtml(state.user.username)}</b>${state.user.is_admin ? " · admin" : ""}</span>`;
    const out = document.createElement("button");
    out.className = "btn-ghost"; out.textContent = "Выйти";
    out.onclick = logout;
    chip.appendChild(out);
    nav.appendChild(chip);
  } else {
    const b = document.createElement("button");
    b.className = "nav-btn" + (state.route === "auth" ? " active" : "");
    b.textContent = "Войти";
    b.onclick = () => navigate("auth");
    nav.appendChild(b);
  }
}

function escapeHtml(s) {
  return String(s).replace(/[&<>"']/g, c => ({ "&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;" }[c]));
}
function money(n) {
  return Number(n).toFixed(2);
}
function formatDate(iso) {
  try {
    const d = new Date(iso);
    return d.toLocaleString("ru-RU", { day:"2-digit", month:"2-digit", year:"numeric", hour:"2-digit", minute:"2-digit" });
  } catch(e) { return iso; }
}

/* =========================================================
   RENDER ROOT
========================================================= */
async function renderAll() {
  renderNav();
  const app = document.getElementById("app");
  app.innerHTML = `<div class="center-loading">загрузка…</div>`;
  try {
    switch (state.route) {
      case "auth": return renderAuth();
      case "cart": return await renderCart();
      case "orders": return await renderOrders();
      case "admin": return await renderAdmin();
      default: return await renderCatalog();
    }
  } catch (e) {
    app.innerHTML = `<div class="empty-state"><h3>Не удалось загрузить</h3><p>${escapeHtml(e.message)}</p></div>`;
  }
}

/* =========================================================
   AUTH VIEW
========================================================= */
function renderAuth() {
  const app = document.getElementById("app");
  const isLogin = state.authTab === "login";
  app.innerHTML = `
    <div class="auth-wrap">
      <div class="tabs">
        <button id="tabLogin" class="${isLogin ? "active" : ""}">Вход</button>
        <button id="tabRegister" class="${!isLogin ? "active" : ""}">Регистрация</button>
      </div>
      <div class="card auth-card">
        <div class="form-error" id="authError"></div>
        <form id="authForm">
          <div class="field">
            <label>Имя пользователя</label>
            <input type="text" id="f_username" required autocomplete="username">
          </div>
          <div class="field">
            <label>Пароль</label>
            <input type="password" id="f_password" required autocomplete="${isLogin ? "current-password" : "new-password"}">
          </div>
          <button class="btn btn-accent btn-block" type="submit">${isLogin ? "Войти" : "Зарегистрироваться"}</button>
        </form>
      </div>
    </div>
  `;
  document.getElementById("tabLogin").onclick = () => { state.authTab = "login"; renderAuth(); };
  document.getElementById("tabRegister").onclick = () => { state.authTab = "register"; renderAuth(); };

  document.getElementById("authForm").onsubmit = async (e) => {
    e.preventDefault();
    const username = document.getElementById("f_username").value.trim();
    const password = document.getElementById("f_password").value;
    const errBox = document.getElementById("authError");
    errBox.classList.remove("show");
    const btn = e.target.querySelector("button[type=submit]");
    btn.disabled = true;
    try {
      if (isLogin) {
        const res = await api("/auth/login", { method: "POST", body: { username, password } });
        setToken(res.access_token);
        await loadCurrentUser();
        toast(`С возвращением, ${state.user.username}!`, "ok");
        await refreshCartCount();
        navigate("catalog");
      } else {
        await api("/auth/register", { method: "POST", body: { username, password } });
        toast("Аккаунт создан. Теперь войдите.", "ok");
        state.authTab = "login";
        renderAuth();
      }
    } catch (err) {
      errBox.textContent = err.message;
      errBox.classList.add("show");
    } finally {
      btn.disabled = false;
    }
  };
}

async function refreshCartCount() {
  if (state.user && !state.user.is_admin) {
    try { state.cart = await api("/cart/", { auth: true }); } catch (e) { state.cart = []; }
  } else {
    state.cart = [];
  }
}

/* =========================================================
   CATALOG VIEW
========================================================= */
let activeCategory = null;

async function renderCatalog() {
  const [categories, products] = await Promise.all([
    api("/categories/"),
    api("/products/"),
  ]);
  state.categories = categories;
  state.products = products;

  const catMap = {};
  categories.forEach(c => catMap[c.id] = c.name);

  const app = document.getElementById("app");
  const filtered = activeCategory ? products.filter(p => p.category_id === activeCategory) : products;

  app.innerHTML = `
    <div class="page-title">
      <h1>Каталог</h1>
      <p>Выберите товар и добавьте его в корзину.</p>
    </div>
    <div class="chips" id="catChips"></div>
    <div id="productGrid"></div>
  `;

  const chipsEl = document.getElementById("catChips");
  const allChip = document.createElement("button");
  allChip.className = "chip" + (!activeCategory ? " active" : "");
  allChip.textContent = "Все";
  allChip.onclick = () => { activeCategory = null; renderCatalog(); };
  chipsEl.appendChild(allChip);
  categories.forEach(c => {
    const chip = document.createElement("button");
    chip.className = "chip" + (activeCategory === c.id ? " active" : "");
    chip.textContent = c.name;
    chip.onclick = () => { activeCategory = c.id; renderCatalog(); };
    chipsEl.appendChild(chip);
  });

  const grid = document.getElementById("productGrid");
  if (filtered.length === 0) {
    grid.innerHTML = `<div class="empty-state"><h3>Пока пусто</h3><p>В этой категории нет товаров.</p></div>`;
    return;
  }
  grid.className = "grid";
  grid.innerHTML = filtered.map(p => `
    <div class="card product-card">
      <div class="product-cat">${escapeHtml(catMap[p.category_id] || "—")}</div>
      <div class="product-name">${escapeHtml(p.name)}</div>
      <div class="product-price mono">${money(p.price)} ₽</div>
      ${renderCatalogAction(p)}
    </div>
  `).join("");

  grid.querySelectorAll("[data-add]").forEach(btn => {
    btn.onclick = () => addToCart(Number(btn.dataset.add), btn);
  });
}

function renderCatalogAction(p) {
  if (!state.user) return `<button class="btn btn-block" data-goto-login>Войти, чтобы купить</button>`;
  if (state.user.is_admin) return `<div style="font-size:12px;color:var(--ink-faint)">Управление в Админ-панели</div>`;
  return `<button class="btn btn-accent btn-block" data-add="${p.id}">В корзину</button>`;
}

document.addEventListener("click", (e) => {
  if (e.target.matches("[data-goto-login]")) navigate("auth");
});

async function addToCart(productId, btnEl) {
  btnEl.disabled = true;
  const original = btnEl.textContent;
  btnEl.textContent = "Добавляем…";
  try {
    await api("/cart/", { method: "POST", auth: true, body: { product_id: productId, quantity: 1 } });
    toast("Добавлено в корзину", "ok");
  } catch (e) {
    if (e.status === 409) {
      // товар уже в корзине — увеличим количество
      try {
        const cart = await api("/cart/", { auth: true });
        const existing = cart.find(c => c.product_id === productId);
        if (existing) {
          await api(`/cart/${existing.id}`, { method: "PATCH", auth: true, body: { quantity: existing.quantity + 1 } });
          toast("Количество увеличено", "ok");
        } else {
          toast(e.message, "err");
        }
      } catch (e2) {
        toast(e2.message, "err");
      }
    } else {
      toast(e.message, "err");
    }
  } finally {
    btnEl.disabled = false;
    btnEl.textContent = original;
    await refreshCartCount();
    renderNav();
  }
}

/* =========================================================
   CART VIEW
========================================================= */
async function renderCart() {
  const cart = await api("/cart/", { auth: true });
  state.cart = cart;
  renderNav();

  const app = document.getElementById("app");
  app.innerHTML = `
    <div class="page-title"><h1>Корзина</h1><p>Проверьте состав заказа перед оформлением.</p></div>
    <div id="cartBody"></div>
  `;
  const body = document.getElementById("cartBody");

  if (cart.length === 0) {
    body.innerHTML = `<div class="empty-state"><h3>Корзина пуста</h3><p>Загляните в каталог, чтобы что-нибудь выбрать.</p></div>`;
    return;
  }

  const total = cart.reduce((s, c) => s + Number(c.subtotal), 0);

  body.innerHTML = `
    <div class="ticket">
      <div class="ticket-head"><span class="oid">КОРЗИНА</span><span class="odate mono">${cart.length} поз.</span></div>
      <div id="cartRows"></div>
      <div class="ttotal"><span>Итого</span><span class="tval">${money(total)} ₽</span></div>
    </div>
    <button class="btn btn-accent" id="checkoutBtn">Оформить заказ</button>
  `;

  const rows = document.getElementById("cartRows");
  rows.innerHTML = cart.map(c => `
    <div class="cart-row" data-id="${c.id}">
      <div class="cname">${escapeHtml(c.product_name)}</div>
      <div class="cprice mono">${money(c.price)} ₽</div>
      <div class="qty-stepper">
        <button data-dec>−</button>
        <span class="qnum">${c.quantity}</span>
        <button data-inc>+</button>
      </div>
      <div class="csub mono">${money(c.subtotal)} ₽</div>
      <button class="cx" data-del title="Удалить">✕</button>
    </div>
  `).join("");

  rows.querySelectorAll(".cart-row").forEach(row => {
    const id = Number(row.dataset.id);
    const item = cart.find(c => c.id === id);
    row.querySelector("[data-inc]").onclick = () => updateCartQty(id, item.quantity + 1);
    row.querySelector("[data-dec]").onclick = () => {
      if (item.quantity <= 1) { deleteCartItem(id); }
      else updateCartQty(id, item.quantity - 1);
    };
    row.querySelector("[data-del]").onclick = () => deleteCartItem(id);
  });

  document.getElementById("checkoutBtn").onclick = checkout;
}

async function updateCartQty(id, quantity) {
  try {
    await api(`/cart/${id}`, { method: "PATCH", auth: true, body: { quantity } });
    await renderCart();
  } catch (e) { toast(e.message, "err"); }
}
async function deleteCartItem(id) {
  try {
    await api(`/cart/${id}`, { method: "DELETE", auth: true });
    toast("Товар удалён из корзины");
    await renderCart();
  } catch (e) { toast(e.message, "err"); }
}
async function checkout() {
  const btn = document.getElementById("checkoutBtn");
  btn.disabled = true; btn.textContent = "Оформляем…";
  try {
    await api("/orders/", { method: "POST", auth: true });
    toast("Заказ оформлен!", "ok");
    await refreshCartCount();
    navigate("orders");
  } catch (e) {
    toast(e.message, "err");
    btn.disabled = false; btn.textContent = "Оформить заказ";
  }
}

/* =========================================================
   ORDERS VIEW
========================================================= */
async function renderOrders() {
  const orders = await api("/orders/", { auth: true });
  const app = document.getElementById("app");
  app.innerHTML = `
    <div class="page-title"><h1>Мои заказы</h1><p>История покупок, последние сверху.</p></div>
    <div id="ordersBody"></div>
  `;
  const body = document.getElementById("ordersBody");
  if (!orders.length) {
    body.innerHTML = `<div class="empty-state"><h3>Заказов пока нет</h3><p>Оформите первый заказ из корзины.</p></div>`;
    return;
  }
  const sorted = [...orders].sort((a, b) => new Date(b.created_at) - new Date(a.created_at));
  body.innerHTML = sorted.map(o => `
    <div class="ticket">
      <div class="ticket-head">
        <span class="oid">ЗАКАЗ №${o.id}</span>
        <span class="odate mono">${escapeHtml(formatDate(o.created_at))}</span>
      </div>
      ${o.items.map(it => `
        <div class="tline">
          <span class="tqty">${it.quantity}×</span>
          <span class="tname">${escapeHtml(it.product_name)}</span>
          <span class="tleader"></span>
          <span class="tval">${money(it.price_at_purchase * it.quantity)} ₽</span>
        </div>
      `).join("")}
      <div class="ttotal"><span>Итого</span><span class="tval">${money(o.total_price)} ₽</span></div>
    </div>
  `).join("");
}

/* =========================================================
   ADMIN VIEW
========================================================= */
let adminTab = "categories";

async function renderAdmin() {
  const app = document.getElementById("app");
  app.innerHTML = `
    <div class="page-title"><h1>Админ-панель</h1><p>Управление категориями и товарами каталога.</p></div>
    <div class="admin-tabs">
      <button class="chip ${adminTab === "categories" ? "active" : ""}" id="tabCat">Категории</button>
      <button class="chip ${adminTab === "products" ? "active" : ""}" id="tabProd">Товары</button>
    </div>
    <div id="adminBody"></div>
  `;
  document.getElementById("tabCat").onclick = () => { adminTab = "categories"; renderAdmin(); };
  document.getElementById("tabProd").onclick = () => { adminTab = "products"; renderAdmin(); };

  if (adminTab === "categories") await renderAdminCategories();
  else await renderAdminProducts();
}

async function renderAdminCategories() {
  const categories = await api("/categories/");
  state.categories = categories;
  const body = document.getElementById("adminBody");
  body.innerHTML = `
    <div class="card table-card">
      <h3>Категории</h3>
      <div class="form-error" id="catErr"></div>
      <table>
        <thead><tr><th>ID</th><th>Название</th><th></th></tr></thead>
        <tbody id="catRows"></tbody>
      </table>
      <div class="admin-add">
        <div class="field"><label>Новая категория</label><input id="newCatName" placeholder="Например, Электроника"></div>
        <button class="btn btn-accent" id="addCatBtn">Добавить</button>
      </div>
    </div>
  `;
  document.getElementById("catRows").innerHTML = categories.map(c => `
    <tr><td class="mono">${c.id}</td><td>${escapeHtml(c.name)}</td>
    <td style="text-align:right"><button class="btn-danger" data-delcat="${c.id}">Удалить</button></td></tr>
  `).join("") || `<tr><td colspan="3" style="color:var(--ink-faint)">Категорий пока нет</td></tr>`;

  document.querySelectorAll("[data-delcat]").forEach(b => {
    b.onclick = async () => {
      try {
        await api(`/categories/${b.dataset.delcat}`, { method: "DELETE", auth: true });
        toast("Категория удалена");
        renderAdminCategories();
      } catch (e) { showAdminErr("catErr", e.message); }
    };
  });

  document.getElementById("addCatBtn").onclick = async () => {
    const name = document.getElementById("newCatName").value.trim();
    if (!name) return;
    try {
      await api("/categories/", { method: "POST", auth: true, body: { name } });
      toast("Категория добавлена", "ok");
      renderAdminCategories();
    } catch (e) { showAdminErr("catErr", e.message); }
  };
}

async function renderAdminProducts() {
  const [categories, products] = await Promise.all([api("/categories/"), api("/products/")]);
  state.categories = categories;
  const catMap = {};
  categories.forEach(c => catMap[c.id] = c.name);

  const body = document.getElementById("adminBody");
  body.innerHTML = `
    <div class="card table-card">
      <h3>Товары</h3>
      <div class="form-error" id="prodErr"></div>
      <table>
        <thead><tr><th>ID</th><th>Название</th><th>Категория</th><th>Цена</th><th></th></tr></thead>
        <tbody id="prodRows"></tbody>
      </table>
      <div class="admin-add">
        <div class="field"><label>Название</label><input id="newProdName" placeholder="Название товара"></div>
        <div class="field">
          <label>Категория</label>
          <select id="newProdCat">${categories.map(c => `<option value="${c.id}">${escapeHtml(c.name)}</option>`).join("") || `<option value="">нет категорий</option>`}</select>
        </div>
        <div class="field" style="max-width:120px"><label>Цена</label><input id="newProdPrice" type="number" step="0.01" min="0" placeholder="0.00"></div>
        <button class="btn btn-accent" id="addProdBtn">Добавить</button>
      </div>
    </div>
  `;
  document.getElementById("prodRows").innerHTML = products.map(p => `
    <tr>
      <td class="mono">${p.id}</td>
      <td>${escapeHtml(p.name)}</td>
      <td>${escapeHtml(catMap[p.category_id] || "—")}</td>
      <td class="price-mono">${money(p.price)} ₽</td>
      <td style="text-align:right"><button class="btn-danger" data-delprod="${p.id}">Удалить</button></td>
    </tr>
  `).join("") || `<tr><td colspan="5" style="color:var(--ink-faint)">Товаров пока нет</td></tr>`;

  document.querySelectorAll("[data-delprod]").forEach(b => {
    b.onclick = async () => {
      try {
        await api(`/products/${b.dataset.delprod}`, { method: "DELETE", auth: true });
        toast("Товар удалён");
        renderAdminProducts();
      } catch (e) { showAdminErr("prodErr", e.message); }
    };
  });

  document.getElementById("addProdBtn").onclick = async () => {
    const name = document.getElementById("newProdName").value.trim();
    const category_id = Number(document.getElementById("newProdCat").value);
    const price = Number(document.getElementById("newProdPrice").value);
    if (!name || !category_id || isNaN(price)) { showAdminErr("prodErr", "Заполните все поля"); return; }
    try {
      await api("/products/", { method: "POST", auth: true, body: { name, category_id, price } });
      toast("Товар добавлен", "ok");
      renderAdminProducts();
    } catch (e) { showAdminErr("prodErr", e.message); }
  };
}

function showAdminErr(id, msg) {
  const el = document.getElementById(id);
  el.textContent = msg;
  el.classList.add("show");
  setTimeout(() => el.classList.remove("show"), 4000);
}

/* =========================================================
   BOOT
========================================================= */
(async function boot() {
  await loadCurrentUser();
  await refreshCartCount();
  navigate("catalog");
})();
</script>
</body>

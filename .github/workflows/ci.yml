name: CI

on: 
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest

    env:
      # Settings() требует эти переменные при импорте приложения,
      # но реальное подключение к БД в тестах идёт через testcontainers,
      # эти значения не используются напрямую
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: test
      POSTGRES_HOST: localhost
      POSTGRES_PORT: 5432
      SECRET_KEY: test
      ACCESS_TOKEN_EXPIRE_MINUTES: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Add uv
        uses: astral-sh/setup-uv@v5

      - name: Dependencies
        run: uv sync

      - name: Format
        run: uv run black --check .

      - name: Tests
        run: uv run pytest
